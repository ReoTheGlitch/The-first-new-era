name: Deploy

on:
  push:
    branches: [ccr-52216415-px8xos]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (Cloudflare preset)
        run: npm run build:cf
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Clean generated Wrangler config
        run: node -e "const fs=require('fs');const p='.output/server/wrangler.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));delete c.site;delete c.build;fs.writeFileSync(p,JSON.stringify(c,null,2))"

      - name: Deploy Worker
        run: npx wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e '
            const keys = ["SUPABASE_URL","SUPABASE_PUBLISHABLE_KEY","SUPABASE_SERVICE_ROLE_KEY","GEMINI_API_KEY"];
            const out = {};
            for (const k of keys) { const v = process.env[k]; if (v) out[k] = v; }
            if (Object.keys(out).length) require("fs").writeFileSync("secrets.tmp.json", JSON.stringify(out));
            else console.log("No runtime secrets configured; skipping.");
          '
          if [ -f secrets.tmp.json ]; then
            npx wrangler secret bulk secrets.tmp.json --name new-era-learning
            rm secrets.tmp.json
          fi
